<script>
'use strict';
const lessons = [{"ch": 1, "num": "1.1", "title": "空间向量及其运算", "goal": "用方向与长度描述空间中的位移，理解数量积如何刻画夹角。", "intro": "从教室的一角走到另一角，路线可以不同，位移却相同。空间向量把“从哪里出发、走向哪里”压缩成方向与长度；数量积则把方向关系转化为一个数。", "concepts": [{"title": "线性运算", "text": "向量相加遵循三角形法则或平行四边形法则。λ > 0 同向，λ < 0 反向，长度变为原来的 |λ| 倍。", "formula": "a + b = b + a；λ(a + b) = λa + λb"}, {"title": "数量积", "text": "θ 为两个非零向量的夹角，范围为 [0, π]。数量积的结果是数，正负反映夹角是锐角还是钝角。", "formula": "a · b = |a| |b| cos θ"}, {"title": "平行与垂直", "text": "对于非零向量，方向共线可用倍数关系判断；垂直可用数量积为零判断。", "formula": "a ∥ b ⇔ a = λb；a ⊥ b ⇔ a · b = 0"}], "example": "已知 |a| = 2，|b| = 3，夹角为 60°，求 |a + b|。", "steps": [{"title": "先把长度转成平方", "text": "向量的自乘等于模的平方，展开后就能利用已知条件。", "formula": "|a + b|² = |a|² + 2a · b + |b|²"}, {"title": "计算数量积", "text": "代入长度与夹角，注意 cos 60° = 1/2。", "formula": "a · b = 2 × 3 × 1/2 = 3"}, {"title": "回到所求的长度", "text": "先求平方，再取非负平方根。", "formula": "|a + b|² = 4 + 6 + 9 = 19，所以 |a + b| = √19"}], "warning": "a · b 是一个数，不是向量；通常 |a + b| ≠ |a| + |b|。讨论夹角时，两个向量都不能是零向量。", "quiz": {"q": "非零向量 a、b 满足 a · b < 0，它们的夹角属于哪个范围？", "options": ["0° ≤ θ < 90°", "θ = 90°", "90° < θ ≤ 180°"], "answer": 2, "explain": "因为 |a||b| > 0，所以 cos θ < 0；结合向量夹角范围，得到 90° < θ ≤ 180°。"}}, {"ch": 1, "num": "1.2", "title": "空间向量基本定理", "goal": "理解基底为什么需要三个不共面的向量，学会用基底分解。", "intro": "平面里的位置可以用两个独立方向表示，空间里则需要三个。基底是描述所有空间向量的一套“方向尺子”，它不必互相垂直，但必须不共面。", "concepts": [{"title": "空间向量基本定理", "text": "若 e₁、e₂、e₃ 不共面，那么任一空间向量 p 都可以且只可以表示为它们的线性组合。", "formula": "p = x e₁ + y e₂ + z e₃（x、y、z 唯一）"}, {"title": "共面向量定理", "text": "若 a、b 不共线，p 与 a、b 共面的充要条件是 p 可以由 a、b 线性表示。", "formula": "p = x a + y b"}, {"title": "用几何关系找系数", "text": "先选择同一起点的三条独立棱作为基底，再用首尾相接和中点关系拆分目标向量。", "formula": "若 M 为 AB 中点，则 OM = (OA + OB)/2"}], "example": "在平行六面体 OABC—O′A′B′C′ 中，设 OA = a，OC = b，OO′ = c。M 为 A′C′ 的中点，求 OM。", "steps": [{"title": "表示两个端点", "text": "底面 OABC 为平行四边形，各侧棱平行且相等。", "formula": "OA′ = a + c；OC′ = b + c"}, {"title": "使用中点关系", "text": "中点的位置向量等于两个端点位置向量的平均。", "formula": "OM = (OA′ + OC′)/2"}, {"title": "合并各个方向", "text": "把三个基底方向的贡献分别合并。", "formula": "OM = (1/2)a + (1/2)b + c"}], "warning": "三个向量“两两不共线”仍可能共面，不能据此断定它们构成空间基底。基底的关键条件是三个向量不共面。", "quiz": {"q": "下列哪一组一定能作为空间向量的一组基底？", "options": ["三个两两不共线的向量", "三个不共面的向量", "任意三个非零向量"], "answer": 1, "explain": "空间基底必须包含三个不共面的向量；前后两个条件都不能排除三个向量共面的情况。"}}, {"ch": 1, "num": "1.3", "title": "空间向量运算的坐标表示", "goal": "把空间向量转成三元数组，用坐标完成运算与角度计算。", "intro": "选取三条两两垂直的数轴，并令单位基向量为 i、j、k，几何运算就变成坐标运算。注意“点的坐标”描述位置，“向量的坐标”描述位移。", "concepts": [{"title": "从点得到向量", "text": "终点坐标减去起点坐标，顺序不能颠倒。", "formula": "A(x₁,y₁,z₁)，B(x₂,y₂,z₂) ⇒ AB = (x₂−x₁,y₂−y₁,z₂−z₁)"}, {"title": "坐标运算", "text": "设 a = (x₁,y₁,z₁)，b = (x₂,y₂,z₂)，加法与数乘逐项进行，数量积是对应坐标乘积之和。", "formula": "a · b = x₁x₂ + y₁y₂ + z₁z₂；|a| = √(x₁² + y₁² + z₁²)"}, {"title": "用坐标求夹角", "text": "先算数量积，再算两个模。算出的余弦值应在 [−1,1] 内。", "formula": "cos θ = (x₁x₂ + y₁y₂ + z₁z₂)/(|a||b|)"}], "example": "已知 A(1,0,1)、B(3,1,2)、C(2,2,0)，求 ∠BAC。", "steps": [{"title": "确定两条有向边", "text": "∠BAC 的顶点是 A，所以都从 A 出发。", "formula": "AB = (2,1,1)；AC = (1,2,−1)"}, {"title": "计算数量积和模", "text": "按对应坐标相乘再相加。", "formula": "AB · AC = 2 + 2 − 1 = 3；|AB| = |AC| = √6"}, {"title": "得到角度", "text": "数量积除以两个模的乘积。", "formula": "cos ∠BAC = 3/6 = 1/2，故 ∠BAC = 60°"}], "warning": "向量 AB 的坐标是 B − A。若把一条边的方向取反，得到的向量夹角可能是原角的补角。", "quiz": {"q": "向量 a = (1,2,−1)，b = (2,−1,0)，二者有什么关系？", "options": ["垂直", "平行", "夹角为 60°"], "answer": 0, "explain": "a · b = 1×2 + 2×(−1) + (−1)×0 = 0，且二者非零，所以垂直。"}}, {"ch": 1, "num": "1.4", "title": "空间向量的应用", "goal": "用方向向量和法向量处理平行、垂直、夹角与距离。", "intro": "空间几何的难点常在“角到底在哪里”。向量法先建系，把直线交给方向向量，把平面交给法向量，再用数量积建立统一的计算路线。", "concepts": [{"title": "方向向量与法向量", "text": "非零向量 n 与平面内两个不共线的方向向量都垂直，就可作为该平面的法向量。", "formula": "n · u = 0，n · v = 0（u、v 不共线）"}, {"title": "位置关系的向量判定", "text": "两直线方向向量共线则平行或重合，数量积为零则方向垂直。直线方向垂直于法向量时，该直线平行于或在平面内。两平面法向量共线则平行或重合，数量积为零则两平面垂直。", "formula": "线 ⊥ 面：u ∥ n；线 ∥ 面或线在面内：u · n = 0"}, {"title": "角度与距离", "text": "线线角、线面角取 [0°,90°]；两平面的夹角取不大于 90° 的角。空间点 P 到平面 α 的距离可用法向量求出，其中 Q 是平面内任一点。", "formula": "cos θ线线 = |u · v|/(|u||v|)；sin θ线面 = |u · n|/(|u||n|)；cos θ面面 = |n₁ · n₂|/(|n₁||n₂|)；d = |QP · n|/|n|"}], "example": "边长为 1 的正方体 ABCD—A₁B₁C₁D₁ 中，求直线 AC₁ 与底面 ABCD 所成的角。", "steps": [{"title": "建立坐标系", "text": "以 A 为原点，AB、AD、AA₁ 所在直线分别为 x、y、z 轴。", "formula": "A(0,0,0)，C₁(1,1,1)"}, {"title": "选取两个向量", "text": "直线用方向向量 u，底面用竖直方向的法向量 n。", "formula": "u = (1,1,1)，n = (0,0,1)"}, {"title": "使用线面角公式", "text": "线面角是直线与法向量夹角的余角，因此使用正弦。", "formula": "sin θ = 1/√3，所以 θ ≈ 35.26°"}], "warning": "线面角公式用 sin，线线角公式用 cos。u · n = 0 只能说明直线平行于或在平面内，要证明严格平行，还须排除直线在平面内。", "quiz": {"q": "直线的方向向量为 (1,0,1)，平面的法向量为 (0,0,1)，线面角是多少？", "options": ["30°", "45°", "60°"], "answer": 1, "explain": "sin θ = 1/(√2×1) = √2/2，且 θ∈[0°,90°]，所以 θ = 45°。"}}, {"ch": 2, "num": "2.1", "title": "直线的倾斜角与斜率", "goal": "把直线的方向转成倾斜角，理解斜率存在的条件。", "intro": "同一个平面内，直线的位置和方向决定它。斜率是沿 x 方向每前进一个单位时，y 的变化量；它既有大小，也有正负。", "concepts": [{"title": "倾斜角", "text": "直线向上的方向与 x 轴正方向所成的角为倾斜角；平行或重合于 x 轴时规定为 0°。", "formula": "0° ≤ α < 180°"}, {"title": "斜率", "text": "当 α ≠ 90° 时，斜率 k = tan α；竖直直线斜率不存在。", "formula": "k = (y₂−y₁)/(x₂−x₁)（x₂ ≠ x₁）"}, {"title": "平行与垂直", "text": "当两条直线斜率都存在时，斜率相等表示平行或重合；斜率乘积为 −1 表示垂直。另须单独考虑水平与竖直直线。", "formula": "k₁ = k₂；k₁k₂ = −1"}], "example": "直线经过 A(−1,2)、B(2,−1)，求斜率与倾斜角。", "steps": [{"title": "计算纵横变化量", "text": "坐标相减要保持同一顺序。", "formula": "Δy = −1−2 = −3；Δx = 2−(−1) = 3"}, {"title": "求斜率", "text": "横坐标不同，因此斜率存在。", "formula": "k = −3/3 = −1"}, {"title": "确定倾斜角", "text": "tan α = −1，结合倾斜角范围，角应在第二象限。", "formula": "α = 135°"}], "warning": "倾斜角不是任意范围内的方向角，不能答成 −45°。斜率不存在并不意味着直线不存在，例如 x = 2。", "quiz": {"q": "直线 x = 3 的倾斜角与斜率分别是什么？", "options": ["0°，0", "90°，不存在", "90°，0"], "answer": 1, "explain": "x = 3 是竖直直线，倾斜角为 90°；tan 90° 无定义，所以斜率不存在。"}}, {"ch": 2, "num": "2.2", "title": "直线的方程", "goal": "根据已知条件选择合适的方程形式，并检查适用范围。", "intro": "“一个点 + 一个方向”就能确定直线。不同的方程形式只是把已知条件放在最方便的位置；写方程前，先检查分母和斜率是否存在。", "concepts": [{"title": "点斜式与斜截式", "text": "已知点 (x₀,y₀) 和斜率 k 时用点斜式；已知斜率和 y 轴截距 b 时用斜截式。竖直直线另写 x = x₀。", "formula": "y−y₀ = k(x−x₀)；y = kx + b"}, {"title": "两点式与截距式", "text": "两点式通常要求 x₁ ≠ x₂ 且 y₁ ≠ y₂；截距式中的 a、b 均非零。特殊情况可直接写水平线或竖直线方程。", "formula": "(y−y₁)/(y₂−y₁) = (x−x₁)/(x₂−x₁)；x/a + y/b = 1"}, {"title": "一般式", "text": "任意直线都能写为一般式，A、B 不同时为 0。方向向量可取 (B,−A)，法向量可取 (A,B)。", "formula": "Ax + By + C = 0（A² + B² > 0）"}], "example": "求经过 P(1,2) 且垂直于直线 2x−y+3 = 0 的直线方程。", "steps": [{"title": "读出已知直线的斜率", "text": "把已知方程整理成斜截式。", "formula": "y = 2x + 3，所以 k₁ = 2"}, {"title": "利用垂直关系", "text": "所求直线的斜率与 2 的乘积为 −1。", "formula": "k₂ = −1/2"}, {"title": "代入点斜式并整理", "text": "最后代入点 P 检验等式是否成立。", "formula": "y−2 = −(x−1)/2 ⇒ x + 2y − 5 = 0"}], "warning": "截距可以为负，但不能把“截距”一律当作正的距离。截距为 0 的直线不能直接使用 x/a + y/b = 1。", "quiz": {"q": "经过 (2,3) 的竖直直线方程是？", "options": ["y = 3", "x = 2", "y−3 = 2(x−2)"], "answer": 1, "explain": "竖直直线上所有点的横坐标相同，均为 2，因此方程是 x = 2。"}}, {"ch": 2, "num": "2.3", "title": "交点坐标与距离公式", "goal": "用联立方程找交点，用距离公式把几何长度代数化。", "intro": "解析几何的核心步骤是“把几何关系翻译成方程”。交点是同时满足两个方程的点，距离则需要区分点到点、点到直线、平行线之间三类情形。", "concepts": [{"title": "交点与两点距离", "text": "求交点就是联立两条直线的方程；两点距离来自勾股定理。", "formula": "|AB| = √[(x₂−x₁)² + (y₂−y₁)²]"}, {"title": "点到直线的距离", "text": "点 P(x₀,y₀) 到 Ax + By + C = 0 的距离，分子取绝对值。", "formula": "d = |Ax₀ + By₀ + C|/√(A² + B²)"}, {"title": "平行直线间距离", "text": "先把两条平行直线写成完全相同的 A、B 系数，再比较常数项。", "formula": "Ax + By + C₁ = 0，Ax + By + C₂ = 0 ⇒ d = |C₁−C₂|/√(A²+B²)"}], "example": "求点 P(1,2) 到直线 3x+4y−6 = 0 的距离。", "steps": [{"title": "识别系数", "text": "直线已经是一般式，可直接使用距离公式。", "formula": "A = 3，B = 4，C = −6"}, {"title": "代入点的坐标", "text": "把 P 的坐标代入直线左边，再取绝对值。", "formula": "|3×1 + 4×2 − 6| = 5"}, {"title": "除以法向量的模", "text": "分母来自 (3,4) 的长度。", "formula": "d = 5/√(9+16) = 1"}], "warning": "平行线距离公式不能直接用于系数未对齐的方程。例如 x+y+1=0 与 2x+2y+6=0，须先把第二式除以 2。", "quiz": {"q": "两条直线 x+y−1=0 与 x+y+3=0 的距离为？", "options": ["2", "2√2", "4"], "answer": 1, "explain": "两式的 x、y 系数已一致，距离为 |−1−3|/√2 = 4/√2 = 2√2。"}}, {"ch": 2, "num": "2.4", "title": "圆的方程", "goal": "从“到定点距离等于定长”理解圆，并掌握配方求圆心半径。", "intro": "圆的方程就是距离定义的坐标翻译。标准式直接显示圆心和半径，一般式适合联立和待定系数；二者之间用配方连接。", "concepts": [{"title": "标准方程", "text": "圆心为 (a,b)，半径为 r，必须满足 r > 0。", "formula": "(x−a)² + (y−b)² = r²"}, {"title": "一般方程", "text": "一般式中的 x²、y² 系数均为 1，且没有 xy 项。配方后可判断是否为实圆。", "formula": "x²+y²+Dx+Ey+F=0；圆心 (−D/2,−E/2)，r=√(D²+E²−4F)/2"}, {"title": "存在条件与求圆方法", "text": "D²+E²−4F > 0 时表示圆，等于 0 时只表示一个点，小于 0 时没有实点。求圆可先设圆心半径，或设 D、E、F 后代入条件。", "formula": "过不共线的三个点可唯一确定一个圆"}], "example": "求圆 x²+y²−4x+2y−4=0 的圆心和半径。", "steps": [{"title": "分别对 x、y 配方", "text": "把常数移到右边，左右同时补上完全平方所需的数。", "formula": "(x²−4x+4) + (y²+2y+1) = 4+4+1"}, {"title": "化成标准式", "text": "括号内分别为完全平方。", "formula": "(x−2)² + (y+1)² = 9"}, {"title": "读出圆心半径", "text": "圆心纵坐标是 −1，半径要对 9 开平方。", "formula": "圆心 (2,−1)，半径 r = 3"}], "warning": "从 (x−a)²+(y−b)²=r² 读圆心时注意符号。方程右边是 r²，不是 r。不是所有 x²+y²+Dx+Ey+F=0 都表示圆。", "quiz": {"q": "方程 x²+y²+2x−4y+5=0 表示什么？", "options": ["半径为 5 的圆", "一个点", "半径为 √5 的圆"], "answer": 1, "explain": "配方得 (x+1)²+(y−2)²=0，所以它只表示点 (−1,2)。"}}, {"ch": 2, "num": "2.5", "title": "直线与圆、圆与圆的位置关系", "goal": "用距离和半径比较判断位置，再用联立方程求交点或弦长。", "intro": "面对位置关系，先看距离往往比直接求交点更清楚。直线与圆比较圆心到直线的距离 d 和半径 r；两个圆比较圆心距 d 与两半径的和、差。", "concepts": [{"title": "直线与圆", "text": "d < r 相交，有两个交点；d = r 相切，有一个交点；d > r 相离，无交点。半弦、圆心距、半径组成直角三角形。", "formula": "相交弦长 L = 2√(r²−d²)"}, {"title": "圆与圆", "text": "设两半径为 R、r，圆心距 d：d>R+r 外离；d=R+r 外切；|R−r|<d<R+r 相交；d=|R−r|>0 内切；d<|R−r| 内含。", "formula": "d = 0 且 R = r 时两圆重合；d = 0 且 R ≠ r 时同心内含"}, {"title": "代数解法", "text": "联立直线与圆可得到一元二次方程，用判别式判断交点数。两圆方程相减可消去平方项；当两圆相交时，所得直线是公共弦所在直线。", "formula": "Δ > 0 两个交点；Δ = 0 一个交点；Δ < 0 无交点"}], "example": "直线 y=1 与圆 x²+y²=9 相交，求弦长。", "steps": [{"title": "先确定圆心与距离", "text": "圆心为原点，半径为 3，原点到 y=1 的距离为 1。", "formula": "r = 3，d = 1 < 3"}, {"title": "利用垂径定理", "text": "圆心向弦作垂线，垂足平分弦。", "formula": "(L/2)² + d² = r²"}, {"title": "计算弦长", "text": "也可代入 y=1 得到 x=±2√2，再求两点距离。", "formula": "L = 2√(9−1) = 4√2"}], "warning": "判定两圆内切时，必须排除同心且等半径的重合情形。求弦长时，√(r²−d²) 只是半弦长。", "quiz": {"q": "半径分别为 3、2 的两圆，圆心距为 1，它们的位置关系是？", "options": ["外切", "相交", "内切"], "answer": 2, "explain": "|3−2| = 1 = d > 0，满足内切条件。"}}, {"ch": 3, "num": "3.1", "title": "椭圆", "goal": "从到两定点的距离之和不变出发，读懂 a、b、c 与离心率。", "intro": "想象用一根绷紧的细绳绕住两个固定点，再用笔拉着绳移动。笔尖形成椭圆；绳长对应距离之和，焦点间距决定椭圆有多“扁”。", "concepts": [{"title": "定义与标准方程", "text": "平面内到两个定点 F₁、F₂ 的距离之和等于常数 2a，且 2a > |F₁F₂| > 0。焦点在 x 轴时为下式；焦点在 y 轴时交换 x、y。", "formula": "x²/a² + y²/b² = 1（a > b > 0）；|PF₁| + |PF₂| = 2a"}, {"title": "几何性质", "text": "长轴长 2a，短轴长 2b，焦点 (±c,0)，范围 |x|≤a、|y|≤b，关于两轴及原点对称。分母较大的项对应长轴与焦点所在轴。", "formula": "c² = a²−b²；e = c/a，0 < e < 1"}, {"title": "直线与椭圆的常用路线", "text": "联立后化为一元二次方程，用判别式看相交，用韦达定理处理两交点。若直线 y=kx+m，则弦长可由横坐标差求出。", "formula": "L = √(1+k²) |x₁−x₂|；(x₁−x₂)² = (x₁+x₂)²−4x₁x₂"}], "example": "椭圆 x²/25+y²/9=1 的焦点、离心率是什么？若 P 在椭圆上且 |PF₁|=4，求 |PF₂|。", "steps": [{"title": "比较分母确定焦点轴", "text": "25 > 9，所以焦点在 x 轴，a=5、b=3。", "formula": "c = √(25−9) = 4"}, {"title": "写出焦点与离心率", "text": "离心率等于半焦距与长半轴之比。", "formula": "F₁(−4,0)，F₂(4,0)；e = 4/5"}, {"title": "回到椭圆定义", "text": "P 在椭圆上，两个焦点距离之和恒为 2a。", "formula": "|PF₂| = 10−4 = 6"}], "warning": "椭圆的 a 始终是长半轴，不能固定把 x² 下方的分母当作 a²。关系式是 a²=b²+c²。", "quiz": {"q": "椭圆 x²/9+y²/25=1 的焦点坐标为？", "options": ["(±4,0)", "(0,±4)", "(0,±5)"], "answer": 1, "explain": "较大分母 25 在 y² 下方，焦点在 y 轴；c=√(25−9)=4，焦点为 (0,±4)。"}}, {"ch": 3, "num": "3.2", "title": "双曲线", "goal": "抓住距离差的绝对值，理解实轴、虚轴和渐近线。", "intro": "椭圆约束“距离之和”，双曲线约束“距离之差的绝对值”。这个小小的变化让封闭曲线变成左右或上下延伸的两支。", "concepts": [{"title": "定义与标准方程", "text": "到两个定点的距离差的绝对值等于常数 2a，且 0 < 2a < |F₁F₂|。焦点在 x 轴时为下式；正项是 y² 时焦点在 y 轴。", "formula": "x²/a² − y²/b² = 1（a,b > 0）；||PF₁|−|PF₂|| = 2a"}, {"title": "几何性质", "text": "焦点 (±c,0)，顶点 (±a,0)，实轴长 2a，虚轴长 2b，范围 |x|≥a。a 与 b 没有固定大小关系。", "formula": "c² = a²+b²；e = c/a > 1"}, {"title": "渐近线", "text": "距离原点越远，双曲线越靠近渐近线。将标准方程右边的 1 换成 0，可快速得到渐近线方程。", "formula": "x²/a²−y²/b²=1 ⇒ y=±(b/a)x；y²/a²−x²/b²=1 ⇒ y=±(a/b)x"}], "example": "求双曲线 x²/9−y²/16=1 的焦点、离心率和渐近线。", "steps": [{"title": "识别实轴方向", "text": "x² 项为正，说明实轴和焦点在 x 轴。", "formula": "a = 3，b = 4"}, {"title": "计算半焦距", "text": "双曲线使用平方和关系。", "formula": "c = √(9+16) = 5；F₁(−5,0)，F₂(5,0)，e = 5/3"}, {"title": "求渐近线", "text": "令 x²/9−y²/16=0，再化成两条直线。", "formula": "y = ±(4/3)x"}], "warning": "双曲线不能通过比较分母大小判断焦点轴，要看哪个平方项为正。联立直线与双曲线时，先检查二次项系数是否为零，再讨论判别式。", "quiz": {"q": "双曲线 y²/4−x²/9=1 的渐近线为？", "options": ["y = ±(2/3)x", "y = ±(3/2)x", "y = ±(4/9)x"], "answer": 0, "explain": "令 y²/4−x²/9=0，可得 y²=(4/9)x²，所以 y=±(2/3)x。"}}, {"ch": 3, "num": "3.3", "title": "抛物线", "goal": "用到焦点与准线等距的定义推导方程，分清 p 与焦点坐标。", "intro": "抛物线上的每个点，到一个固定点的距离，等于到一条固定直线的距离。固定点叫焦点，固定直线叫准线，焦点不在准线上。", "concepts": [{"title": "定义与右开口标准式", "text": "令焦点为 (p/2,0)，准线为 x=−p/2，其中 p>0。把两段距离相等写出来，平方化简即可得到标准式。", "formula": "y² = 2px；焦点 F(p/2,0)，准线 x = −p/2"}, {"title": "四种方向", "text": "看一次项的变量判断对称轴，再看一次项系数的符号判断开口方向。以下均设 p>0；顶点在原点，离心率 e=1。", "formula": "y²=2px：向右，F(p/2,0)，准线 x=−p/2<br>y²=−2px：向左，F(−p/2,0)，准线 x=p/2<br>x²=2py：向上，F(0,p/2)，准线 y=−p/2<br>x²=−2py：向下，F(0,−p/2)，准线 y=p/2"}, {"title": "焦半径与通径", "text": "对于 y²=2px，点 P(x₀,y₀) 到准线的距离为 x₀+p/2，也就是焦半径。过焦点且垂直于对称轴的弦称通径。", "formula": "|PF| = x₀ + p/2；通径长 = 2p"}], "example": "抛物线 y²=8x 的焦点与准线是什么？点 P 在抛物线上且横坐标为 3，求 |PF|。", "steps": [{"title": "比较系数", "text": "标准式里 x 的系数是 2p，不能直接把 8 当作 p。", "formula": "2p = 8 ⇒ p = 4"}, {"title": "写出焦点与准线", "text": "焦点与准线分别位于顶点左右两侧，距离顶点均为 p/2。", "formula": "F(2,0)；准线 x = −2"}, {"title": "利用等距定义", "text": "点到焦点距离等于到准线的距离，不必先求纵坐标。", "formula": "|PF| = 3−(−2) = 5"}], "warning": "在 y²=2px 的记法中，p 是焦点到准线的距离，焦点到顶点的距离是 p/2。不同资料的参数记法可能不同，应先对照标准式。", "quiz": {"q": "抛物线 x²=−12y 的焦点是？", "options": ["(0,−3)", "(0,−6)", "(−3,0)"], "answer": 0, "explain": "与 x²=−2py 比较得 p=6，开口向下，焦点为 (0,−p/2)=(0,−3)。"}}];
